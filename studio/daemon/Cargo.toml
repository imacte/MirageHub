[package]
name = "openrazer-daemon"
description = "Native Rust device control backend for OpenRazer Studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Devices_Bluetooth_GenericAttributeProfile", "Foundation", "Storage_Streams", "Win32_System_WinRT", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-future = "0.3"
windows-sys = { workspace = true, features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }
winreg.workspace = true
