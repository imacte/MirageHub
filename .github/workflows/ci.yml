name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Development tools (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo clippy --locked -p mirage-hub-tools --all-targets -- -D warnings
      - run: cargo test --locked -p mirage-hub-tools
      - run: cargo run --locked -p mirage-hub-tools -- check-translations
      - run: cargo run --locked -p mirage-hub-tools -- docs-data --check
      - name: Check generated application and website icons
        run: |
          cargo run --locked -p mirage-hub-tools -- icons
          git -C .. diff --exit-code -- assets/mirage-hub.ico assets/mirage-hub.png docs/favicon.svg

  gui:
    name: Control panel (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        # The version pinned in gui/rust-toolchain.toml.
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gui/target
          key: gui-${{ runner.os }}-${{ hashFiles('gui/Cargo.lock') }}
      - name: Lint
        run: cargo clippy --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Check the build that carries the daemon
        # Any file stands in for the daemon; this only compiles that path.
        env:
          OPENRAZER_EMBED_DAEMON: ${{ github.workspace }}/gui/Cargo.toml
        run: cargo check --locked
      - name: Build
        run: cargo build --release --locked
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/mirage-hub-classic.exe -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          exit 0

  studio:
    name: Mirage Hub (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        # The version pinned in studio/rust-toolchain.toml.
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            studio/target
          key: studio-${{ runner.os }}-${{ hashFiles('studio/Cargo.lock') }}
      - name: Every string has Russian and Simplified Chinese translations
        run: cargo run --locked -p mirage-hub-tools -- check-translations
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Test the Chroma DLL as 32-bit games load it
        run: cargo test --locked -p mirage-hub-chroma --target i686-pc-windows-msvc
      - name: Build the native daemon, Studio, Chroma DLLs and installer
        shell: pwsh
        run: ./tools/build-native.ps1
      - name: Test the shipped daemon and embedded Chroma DLLs
        shell: pwsh
        run: |
          $env:OPENRAZER_TEST_DAEMON = "$PWD/../dist/mirage-hub-daemon.exe"
          cargo test --locked -p mirage-hub-daemon --test executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OPENRAZER_STUDIO_CHROMA = "$PWD/target/native-chroma"
          cargo test --locked -p mirage-hub chroma
      - name: Install, repair and remove
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\lad"
          ./tools/installer-cycle.ps1 -Setup ../dist/mirage-hub-setup.exe -Dir "$env:RUNNER_TEMP\studio-install"
      - name: Upgrade an existing RsRazer installation
        shell: pwsh
        run: ./tools/installer-upgrade.ps1 -Setup ../dist/mirage-hub-setup.exe -Root "$env:RUNNER_TEMP\rsrazer-upgrade"
