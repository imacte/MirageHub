name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build native daemon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        working-directory: studio
        run: rustup toolchain install

      - name: Build the native daemon and CLI
        shell: pwsh
        run: ./studio/tools/build-native.ps1 -DaemonOnly

      - name: Test the shipped native daemon with simulated devices
        working-directory: studio
        env:
          OPENRAZER_TEST_DAEMON: ${{ github.workspace }}/dist/rsrazer-daemon.exe
        run: cargo test --locked -p rsrazer-daemon --test executable

      - name: Smoke-test the executable
        # The runner appends `exit $LASTEXITCODE`, so the script has to end on a
        # deliberate exit: `autostart status` reports 1 when autostart is off,
        # which is the expected state on a fresh runner.
        run: |
          .\dist\rsrazer-daemon.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\rsrazer-daemon.exe supported viper
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\rsrazer-daemon.exe doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\rsrazer-daemon.exe autostart status
          if ($LASTEXITCODE -notin 0, 1) { exit 1 }
          exit 0
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/rsrazer-daemon.exe
          if-no-files-found: error

  gui:
    name: Build the control panel
    # It carries the native daemon inside it, so it is built after that.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: daemon
      - name: Install Rust
        # The version pinned in gui/rust-toolchain.toml.
        working-directory: gui
        run: rustup toolchain install
      - name: Build
        working-directory: gui
        env:
          OPENRAZER_EMBED_DAEMON: ${{ github.workspace }}/daemon/rsrazer-daemon.exe
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          # --self-test also fails a build whose embedded daemon is missing or broken.
          $p = Start-Process -FilePath gui/target/x86_64-pc-windows-msvc/release/rsrazer-classic.exe -ArgumentList '--self-test','--require-daemon' -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          ./studio/tools/check-native.ps1 -Files gui/target/x86_64-pc-windows-msvc/release/rsrazer-classic.exe
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item gui/target/x86_64-pc-windows-msvc/release/rsrazer-classic.exe dist/
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: gui
          path: dist/rsrazer-classic.exe
          if-no-files-found: error

  studio:
    name: Build RsRazer and its installer
    # The installer carries the native daemon, so it is built after that.
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: daemon
      - name: Install Rust
        # The version pinned in studio/rust-toolchain.toml.
        run: rustup toolchain install
      - name: Build Studio, both Chroma DLLs and the installer
        shell: pwsh
        run: ./tools/build-native.ps1 -DaemonPath ../daemon/rsrazer-daemon.exe
      - name: Install, repair and remove
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\lad"
          ./tools/installer-cycle.ps1 -Setup ../dist/rsrazer-setup.exe -Dir "$env:RUNNER_TEMP\studio-install"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: studio
          path: |
            dist/rsrazer-setup.exe
            dist/rsrazer.exe
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [build, gui, studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published, with checksums
        # The executables are not code-signed; the checksums let anyone check
        # that what they downloaded is what this workflow built.
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - name: Install Rust for the release tools
        working-directory: studio
        run: rustup toolchain install

      - name: Write the release's text from the changelogs
        # Studio shows this on its Updates page, so it fails here rather than
        # publish a release with nothing to say.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        working-directory: studio
        run: cargo run --quiet --locked -p rsrazer-tools -- release-notes "$TAG" > ../release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          body_path: release-body.md
